    /**
     * عرض رسالة تنبيه مؤقتة داخل الواجهة
     */
    function showToast(message) {
      try {
        const banner = document.getElementById('toast-banner');
        const textEl = document.getElementById('toast-text');
        if (!banner || !textEl) return;
        textEl.textContent = message;
        banner.classList.remove('hidden');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          hideToast();
        }, 3200);
      } catch (err) {
        console.error('خطأ في عرض التنبيه:', err);
      }
    }

    function hideToast() {
      const banner = document.getElementById('toast-banner');
      if (banner) banner.classList.add('hidden');
    }

    /**
     * تطبيق تفضيلات الراحة وإمكانية الوصول على الصفحة
     */
    function applyAccessibilityPreferences() {
      try {
        const { highContrast, reduceMotion, fontScale, quietMode } = state.preferences;
        document.body.classList.toggle('high-contrast', Boolean(highContrast));
        document.body.classList.toggle('reduce-motion', Boolean(reduceMotion));
        document.documentElement.style.setProperty('--font-scale', String(fontScale || 1));

        const quietIcon = document.getElementById('quiet-mode-icon');
        if (quietIcon) {
          quietIcon.textContent = quietMode ? '🔕' : '🌿';
        }
      } catch (err) {
        console.error('خطأ في تطبيق التفضيلات:', err);
      }
    }

    function toggleQuietMode() {
      state.preferences.quietMode = !state.preferences.quietMode;
      applyAccessibilityPreferences();
      showToast(
        state.preferences.quietMode
          ? 'تم تفعيل وضع الهدوء وتقليل التنبيهات.'
          : 'تم إيقاف وضع الهدوء والعودة للوضع المعتاد.'
      );
      if (state.activeScreen === 'profile') render();
    }

    /**
     * التنقل بين الشاشات الخمس الرئيسية
     */
    function navigateTo(screenName) {
      const validScreens = ['home', 'circles', 'chat', 'resources', 'profile'];
      if (!validScreens.includes(screenName)) return;
      state.activeScreen = screenName;
      render();
      window.scrollTo({ top: 0, behavior: state.preferences.reduceMotion ? 'auto' : 'smooth' });
    }

    /**
     * تحديث حالة المزاج اليومي
     */
    function setMood(moodLabel) {
      state.mood = moodLabel;
      showToast(`تم تسجيل حالتك اليوم: ${moodLabel}`);
      render();
    }

     * تصفية الدوائر المجتمعية حسب الموضوع
     */
    function filterCircles(topic) {
      state.selectedTopic = topic;
      render();
    }

    /**
     * الانضمام إلى دائرة دعم أو مغادرتها
     */
    function toggleJoinCircle(circleId) {
      const circle = state.circles.find((c) => c.id === circleId);
      if (!circle) return;

      circle.joined = !circle.joined;
      circle.membersCount += circle.joined ? 1 : -1;

      // إنشاء غرفة محادثة للدائرة عند الانضمام إن لم تكن موجودة
      if (circle.joined && !state.threads[circle.id]) {
        state.threads[circle.id] = {
          title: circle.title,
          subtitle: `${circle.topic} • مساحة دعم آمنة`,
          messages: [
            {
              id: `welcome-${Date.now()}`,
              sender: 'فريق ملاذ',
              role: 'ميسّر',
              time: 'الآن',
              text: `مرحباً بك في "${circle.title}". هذه المساحة مخصصة للحوار الهادئ والدعم المتبادل.`,
              isSelf: false,
              supportCount: 2,
            }
          ]
        };
      }

      if (circle.joined) {
        state.activeThreadId = circle.id;
      } else if (state.activeThreadId === circle.id) {
        state.activeThreadId = 'circle-belonging';
      }

      showToast(
        circle.joined
          ? `انضممت إلى "${circle.title}".`
          : `غادرت "${circle.title}" ويمكنك العودة في أي وقت.`
      );
      render();
    }

    function openCircleChat(circleId) {
      if (!state.threads[circleId]) {
        const circle = state.circles.find((c) => c.id === circleId);
        state.threads[circleId] = {
          title: circle ? circle.title : 'دائرة دعم',
          subtitle: 'مساحة حوار آمنة',
          messages: []
        };
      }
      state.activeThreadId = circleId;
      state.activeScreen = 'chat';
      render();
    }

    /**
     * إرسال رسالة داعمة في المحادثة الآمنة
     */
    function sendSupportMessage(event) {
      if (event) event.preventDefault();
      try {
        const input = document.getElementById('chat-input');
        const rawText = input ? input.value.trim() : state.draftMessage.trim();
        if (!rawText) {
          showToast('اكتب رسالة داعمة أولاً أو اختر عبارة جاهزة.');
          return;
        }

        const thread = state.threads[state.activeThreadId] || state.threads['circle-belonging'];
        const senderName = state.preferences.anonymousByDefault
          ? 'أنت (باسم مستعار: رفيق هادئ)'
          : 'أنت (ملفي الشخصي)';

        thread.messages.push({
          id: `msg-${Date.now()}`,
          sender: senderName,
          role: 'عضو',
          time: 'الآن',
          text: rawText,
          isSelf: true,
          supportCount: 1,
        });

        state.draftMessage = '';
        state.selectedStarter = '';
        showToast('تم إرسال رسالتك الداعمة بأمان.');
        render();
      } catch (err) {
        console.error('خطأ أثناء إرسال الرسالة:', err);
        showToast('تعذر إرسال الرسالة، حاول مرة أخرى.');
      }
    }

    function applyStarter(text) {
      state.draftMessage = text;
      state.selectedStarter = text;
      render();
    }

    function reactSupport(threadId, messageId) {
      const thread = state.threads[threadId];
      if (!thread) return;
      const msg = thread.messages.find((m) => m.id === messageId);
      if (!msg) return;
      msg.supportCount += 1;
      showToast('أرسلت إشارة دعم لطيفة.');
      render();
    }

    /**
     * تصفية وحفظ الإرشادات والموارد
     */
    function filterResources(category) {
      state.resourceCategory = category;
      render();
    }

    function toggleSaveResource(resourceId) {
      const item = state.resources.find((r) => r.id === resourceId);
      if (!item) return;
      item.saved = !item.saved;
      showToast(item.saved ? 'تم حفظ الإرشاد في مرجعك.' : 'تمت إزالة الإرشاد من المحفوظات.');
      render();
    }

    /**
     * تحديث خيارات التفضيلات وإمكانية الوصول
     */
    function updatePreference(key, value) {
      state.preferences[key] = value;
      applyAccessibilityPreferences();
      showToast('تم حفظ التفضيل بنجاح.');
      render();
    }

                    type="button"
                    onclick="applyStarter('${starter.replace(/'/g, "\\'")}')"
                    class="text-right text-xs font-semibold px-3 py-2 rounded-2xl bg-malath-sand hover:bg-malath-tealSoft border border-malath-sandBorder text-malath-slate transition"

              <input
                id="chat-input"
                type="text"
                value="${state.draftMessage.replace(/"/g, '&quot;')}"
                oninput="state.draftMessage = this.value"

     */

                  <button
                    type="button"
                    onclick="toggleSaveResource('${item.id}')"
                    class="text-xs font-bold px-3 py-1.5 rounded-xl border transition ${
                      item.saved
                        ? 'bg-malath-amberSoft border-malath-amberCalm text-malath-amberCalm'
                        : 'bg-malath-sand border-malath-sandBorder text-malath-slate hover:bg-malath-tealSoft'
                    }"
                  >
                    ${item.saved ? '★ محفوظ' : '☆ حفظ'}
                  </button>
                </div>

                <h3 class="text-lg font-extrabold text-malath-slate">${item.title}</h3>
                <p class="malath-muted text-sm text-malath-slateMuted font-medium">${item.excerpt}</p>
                <p class="text-sm text-malath-slate bg-malath-sand/80 rounded-2xl p-3.5 leading-relaxed">
                  ${item.body}
                </p>
              </article>
            `).join('')}
          </div>
        </section>
      `;
    }

    /**
     * بناء شاشة الحساب وتفضيلات الراحة وإمكانية الوصول
     */
    function renderProfileScreen() {
      const { quietMode, highContrast, reduceMotion, fontScale, anonymousByDefault, gentleReminders } = state.preferences;

      return `
        <section class="space-y-4">
          <!-- بطاقة الهوية والخصوصية -->
          <div class="malath-surface bg-malath-sandCard border border-malath-sandBorder rounded-3xl p-5 shadow-soft">
            <div class="flex items-center gap-3.5">
              <div class="w-14 h-14 rounded-2xl bg-malath-tealSoft text-malath-tealDark flex items-center justify-center text-2xl font-bold shrink-0">
                م
              </div>
              <div>
                <h2 class="text-xl font-extrabold text-malath-slate">حسابي وتفضيلات الراحة</h2>
                <p class="malath-muted text-sm text-malath-slateMuted">
                  خصّص الواجهة لتناسب راحتك البصرية والحسية دون أي تعقيد.
                </p>
              </div>
            </div>
          </div>

          <!-- خيارات إمكانية الوصول والراحة -->
          <div class="malath-surface bg-malath-sandCard border border-malath-sandBorder rounded-3xl p-5 shadow-soft space-y-4">
            <h3 class="text-base font-extrabold text-malath-slate">إمكانية الوصول والراحة الحسية</h3>

            <!-- حجم الخط -->
            <div class="p-3.5 rounded-2xl bg-malath-sand/80 border border-malath-sandBorder space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-sm font-bold text-malath-slate">حجم النص</span>
                <span class="text-xs font-bold text-malath-tealDark">${Math.round(fontScale * 100)}%</span>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <button
                  type="button"
                  onclick="updatePreference('fontScale', 1)"
                  class="py-2 rounded-xl text-xs font-bold border transition ${
                    fontScale === 1 ? 'bg-malath-teal text-white border-malath-teal' : 'bg-malath-sandCard text-malath-slate border-malath-sandBorder'
                  }"
                >
                  عادي (100%)
                </button>
                <button
                  type="button"
                  onclick="updatePreference('fontScale', 1.1)"
                  class="py-2 rounded-xl text-xs font-bold border transition ${
                    fontScale === 1.1 ? 'bg-malath-teal text-white border-malath-teal' : 'bg-malath-sandCard text-malath-slate border-malath-sandBorder'
                  }"
                >
                  مريح (110%)
                </button>
                <button
                  type="button"
                  onclick="updatePreference('fontScale', 1.2)"
                  class="py-2 rounded-xl text-xs font-bold border transition ${
                    fontScale === 1.2 ? 'bg-malath-teal text-white border-malath-teal' : 'bg-malath-sandCard text-malath-slate border-malath-sandBorder'
                  }"
                >
                  كبير (120%)
                </button>
              </div>
            </div>

            <!-- مفاتيح التبديل التفاعلية -->
            ${renderToggleRow(
              'وضع الهدوء وتقليل التنبيهات',
              'يقلل المحفزات البصرية والضجيج الرقمي أثناء التصفح.',
              quietMode,
              'quietMode'
            )}
            ${renderToggleRow(
              'تباين عالٍ للوضوح',
              'يزيد وضوح الحدود والنصوص لمن يفضلون تبايناً أقوى.',
              highContrast,
              'highContrast'
            )}
            ${renderToggleRow(
              'تقليل الحركة والانتقالات',
              'يجعل التنقل بين الشاشات مباشراً وساكناً قدر الإمكان.',
              reduceMotion,
              'reduceMotion'
            )}
            ${renderToggleRow(
              'الظهور باسم مستعار افتراضياً',
              'يحافظ على خصوصيتك عند إرسال الرسائل في الدوائر.',
              anonymousByDefault,
              'anonymousByDefault'
            )}
            ${renderToggleRow(
              'تذكيرات لطيفة وغير ملحة',
              'رسائل تشجيعية هادئة عند العودة لتصفح الإرشادات.',
              gentleReminders,
              'gentleReminders'
            )}
          </div>
        </section>
      `;
    }

    function renderToggleRow(title, subtitle, enabled, prefKey) {
      return `
        <div class="flex items-center justify-between gap-4 p-3.5 rounded-2xl bg-malath-sand/70 border border-malath-sandBorder">
          <div class="min-w-0">
            <div class="text-sm font-bold text-malath-slate">${title}</div>
            <div class="malath-muted text-xs text-malath-slateMuted mt-0.5">${subtitle}</div>
          </div>
          <button
            type="button"
            role="switch"
            aria-checked="${enabled}"
            aria-label="${title}"
            onclick="updatePreference('${prefKey}', ${!enabled})"
            class="w-13 h-7 w-12 rounded-full p-1 transition shrink-0 flex items-center ${
              enabled ? 'bg-malath-teal justify-start' : 'bg-slate-300 justify-end'
            }"
          >
            <span class="w-5 h-5 rounded-full bg-white shadow-sm block"></span>
          </button>
        </div>
      `;
    }

    /**
     * تحديث حالة أزرار التنقل العلوية والسفلية
     */
    function updateNavActiveStates() {
      document.querySelectorAll('[data-nav]').forEach((btn) => {
        const target = btn.getAttribute('data-nav');
        const isActive = target === state.activeScreen;

        if (btn.classList.contains('nav-pill')) {
          btn.className = `nav-pill flex-1 py-2.5 px-3 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2 ${
            isActive
              ? 'bg-malath-teal text-white shadow-sm'
              : 'text-malath-slate hover:bg-malath-tealSoft'
          }`;
        }

        if (btn.classList.contains('mobile-nav-btn')) {
          btn.className = `mobile-nav-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl text-[11px] font-bold transition ${
            isActive
              ? 'bg-malath-tealSoft text-malath-tealDark'
              : 'text-malath-slateMuted hover:bg-malath-sand'
          }`;
        }
      });
    }

    /**
     * إعادة رسم الشاشة الحالية
     */
    function render() {
      try {
        const container = document.getElementById('screen-container');
        if (!container) return;

        let html = '';
        switch (state.activeScreen) {
          case 'circles':
            html = renderCirclesScreen();
            break;
          case 'chat':
            html = renderChatScreen();
            break;
          case 'resources':
            html = renderResourcesScreen();
            break;
          case 'profile':
            html = renderProfileScreen();
            break;
          case 'home':
          default:
            html = renderHomeScreen();
            break;
        }

        container.innerHTML = html;
        container.classList.remove('screen-enter');
        void container.offsetWidth; // إعادة تشغيل حركة الدخول البسيطة
        container.classList.add('screen-enter');

        updateNavActiveStates();
        applyAccessibilityPreferences();
      } catch (err) {
        console.error('خطأ أثناء عرض الواجهة:', err);
      }
    }

    // تشغيل التطبيق عند اكتمال تحميل الصفحة
    document.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
